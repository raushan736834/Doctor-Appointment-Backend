spring.datasource.url=${Azure_Backend_Url}
spring.datasource.username=${Azure_DB_User}
spring.datasource.password=${Azure_DB_Pass}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8080
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-request-size=20MB

server.error.include-message=always
server.error.include-binding-errors=always

jwt.secret=${JWT_Secret}

#Email Configuration
spring.mail.username=${MAIL_SERVICE_USERNAME}
spring.mail.password=${MAIL_SERVICE_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#Thymleaf Configuration
spring.thymeleaf.cache=false
server.address=0.0.0.0

socket.host=localhost
#socket.host=localhost
socket.port=8081

razorpay.key.id=${Razorpay_Key_Id}
razorpay.key.secret=${Razorpay_Key_Secret}
razorpay.webhook.secret=${Razorpay_Webhook}

refund.retry.max=5
refund.retry.interval.minutes=10
